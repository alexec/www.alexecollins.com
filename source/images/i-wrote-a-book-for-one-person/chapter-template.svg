<svg xmlns='http://www.w3.org/2000/svg' width='760' height='520' viewBox='0 0 760 520' font-family='-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='760' height='520' fill='#fcfcfb'/>
<text x='24' y='34' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='600' >The shape of every chapter</text>
<text x='24' y='56' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal' >The same eight beats, 26 times, in the printed first edition. Chapter One, Maths, as the example.</text>
<circle cx='40' cy='98' r='12' fill='#2a78d6'/>
<text x='40' y='103' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >1</text>
<line x1='40' y1='110' x2='40' y2='138' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='96' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Where you meet it</text>
<text x='64' y='114' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >One line of everyday places the idea shows up.</text>
<text x='400' y='96' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='96' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >carpets and kitchen tiles, doubling a recipe,</text>
<text x='426' y='112' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >a drumbeat, sharing out sweets</text>
<circle cx='40' cy='150' r='12' fill='#2a78d6'/>
<text x='40' y='155' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >2</text>
<line x1='40' y1='162' x2='40' y2='190' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='148' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >The making story</text>
<text x='64' y='166' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >The main body. How this layer came to exist, told plainly.</text>
<text x='400' y='148' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='148' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >look at a patterned rug: a shape repeats,</text>
<text x='426' y='164' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >evenly, out to the edge</text>
<circle cx='40' cy='202' r='12' fill='#2a78d6'/>
<text x='40' y='207' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >3</text>
<line x1='40' y1='214' x2='40' y2='242' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='200' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >The bit worth telling someone</text>
<text x='64' y='218' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >One boxed idea to retell at dinner. Cut in the second edition.</text>
<text x='400' y='200' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='200' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >Euclid&#x27;s proof that the primes never run out</text>
<circle cx='40' cy='254' r='12' fill='#2a78d6'/>
<text x='40' y='259' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >4</text>
<line x1='40' y1='266' x2='40' y2='294' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='252' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >When it arrived</text>
<text x='64' y='270' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Every layer has a date. This is the moment it switched on.</text>
<text x='400' y='252' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='252' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >the one chapter with no date</text>
<circle cx='40' cy='306' r='12' fill='#2a78d6'/>
<text x='40' y='311' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >5</text>
<line x1='40' y1='318' x2='40' y2='346' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='304' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >What it makes possible</text>
<text x='64' y='322' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >The specific thing the next layer up gets to rely on.</text>
<text x='400' y='304' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='304' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >combinations are reliable, here and on the</text>
<text x='426' y='320' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >other side of the galaxy</text>
<circle cx='40' cy='358' r='12' fill='#2a78d6'/>
<text x='40' y='363' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >6</text>
<line x1='40' y1='370' x2='40' y2='398' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='356' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >The recipe</text>
<text x='64' y='374' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Ingredients on the left, this layer on the right.</text>
<text x='400' y='356' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='356' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >nothing + nothing → maths</text>
<circle cx='40' cy='410' r='12' fill='#2a78d6'/>
<text x='40' y='415' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >7</text>
<line x1='40' y1='422' x2='40' y2='450' stroke='#e6e5e1' stroke-width='2'/>
<text x='64' y='408' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >The open question</text>
<text x='64' y='426' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Where the book admits nobody knows.</text>
<text x='400' y='408' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='408' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >why does reality use these rules and not</text>
<text x='426' y='424' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >others?</text>
<circle cx='40' cy='462' r='12' fill='#2a78d6'/>
<text x='40' y='467' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600' >8</text>
<text x='64' y='460' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >The bridge</text>
<text x='64' y='478' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >One sentence pointing at the next rung.</text>
<text x='400' y='460' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' font-style='italic'>e.g.</text>
<text x='426' y='460' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >out of everything that could have been true,</text>
<text x='426' y='476' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal' >the handful that is</text>
<text x='24' y='506' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Twenty-three layers, 26 interludes, three appendices, 448 pages. I wrote the structure, not the sentences.</text>
</svg>