<svg xmlns='http://www.w3.org/2000/svg' width='900' height='510' viewBox='0 0 900 510' font-family='-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width='900' height='510' fill='#fcfcfb'/>
<defs><marker id='arr' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 Z' fill='#8a8985'/></marker></defs>
<text x='24' y='34' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='600' >How each chapter got made</text>
<text x='24' y='56' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal' >Four Claude agents with different briefs, one human who signs off. Repeated 26 times.</text>
<rect x='24' y='80' width='236' height='100' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='2' />
<rect x='24' y='80' width='6' height='100' rx='3' fill='#0b0b0b'/>
<text x='40' y='104' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Alex: the brief</text>
<text x='40' y='124' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Chapter list and order</text>
<text x='40' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >What each chapter must cover</text>
<text x='40' y='156' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >The chapter template</text>
<text x='40' y='172' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Reading age, tone, art direction</text>
<rect x='330' y='80' width='236' height='100' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2' />
<rect x='330' y='80' width='6' height='100' rx='3' fill='#2a78d6'/>
<text x='346' y='104' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Author (Claude)</text>
<text x='346' y='124' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Writes the chapter draft</text>
<text x='346' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Follows the template</text>
<text x='346' y='156' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Scores its own reading level</text>
<text x='346' y='172' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >and revises until it hits the target</text>
<path d='M260,130 L328,130' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<text x='295' y='122' font-size='11' fill='#8a8985' text-anchor='middle' font-weight='normal' >brief</text>
<rect x='636' y='80' width='236' height='100' rx='8' fill='#ffffff' stroke='#1baf7a' stroke-width='2' />
<rect x='636' y='80' width='6' height='100' rx='3' fill='#1baf7a'/>
<text x='652' y='104' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Copy Editor (Claude)</text>
<text x='652' y='124' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Reviews the prose</text>
<text x='652' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Pushes it toward plain, natural</text>
<text x='652' y='156' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >sentences a ten year old</text>
<text x='652' y='172' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >would want to read</text>
<path d='M566,130 L634,130' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<text x='601' y='122' font-size='11' fill='#8a8985' text-anchor='middle' font-weight='normal' >draft</text>
<path d='M756,180 L756,204 L450,204 L450,182' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<text x='601' y='220' font-size='11' fill='#8a8985' text-anchor='middle' font-weight='normal' >notes go back to the Author until the Copy Editor is satisfied</text>
<rect x='330' y='256' width='236' height='100' rx='8' fill='#ffffff' stroke='#4a3aa7' stroke-width='2' />
<rect x='330' y='256' width='6' height='100' rx='3' fill='#4a3aa7'/>
<text x='346' y='280' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Editor (Claude)</text>
<text x='346' y='300' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Reads the book so far</text>
<text x='346' y='316' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Checks the argument holds</text>
<text x='346' y='332' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >and nothing is used before</text>
<text x='346' y='348' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >it has been explained</text>
<path d='M796,180 L796,240 L566,240 L566,254' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<rect x='636' y='256' width='236' height='100' rx='8' fill='#ffffff' stroke='#eda100' stroke-width='2' stroke-dasharray='6 4'/>
<rect x='636' y='256' width='6' height='100' rx='3' fill='#eda100'/>
<text x='652' y='280' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Dependency checker (script)</text>
<text x='652' y='300' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Runs after every chapter</text>
<text x='652' y='316' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Flags anything that appears</text>
<text x='652' y='332' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >before its own chapter</text>
<text x='652' y='348' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Added after luck stopped working</text>
<path d='M566,306 L634,306' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<rect x='24' y='256' width='236' height='100' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='2' />
<rect x='24' y='256' width='6' height='100' rx='3' fill='#0b0b0b'/>
<text x='40' y='280' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Alex: sign off or send back</text>
<text x='40' y='300' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Reads the chapter</text>
<text x='40' y='316' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Either signs it off</text>
<text x='40' y='332' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >or sends it back with a note</text>
<text x='40' y='348' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Nothing ships without this</text>
<path d='M328,306 L262,306' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<path d='M144,356 L144,410 L450,410 L450,358' stroke='#8a8985' stroke-width='1.5' fill='none' marker-end='url(#arr)'/>
<text x='297' y='424' font-size='11' fill='#8a8985' text-anchor='middle' font-weight='normal' >sent back: round it goes again</text>
<rect x='636' y='380' width='236' height='84' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2' />
<rect x='636' y='380' width='6' height='84' rx='3' fill='#eb6834'/>
<text x='652' y='404' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='600' >Artist (Claude)</text>
<text x='652' y='424' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Cover: dozens of variations,</text>
<text x='652' y='440' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Alex picked one</text>
<text x='652' y='456' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Illustrations and the layer colors</text>
<text x='636' y='480' font-size='11' fill='#8a8985' text-anchor='start' font-weight='normal' >Runs alongside the writing, outside the loop</text>
<text x='24' y='498' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal' >Narrow briefs made the reviews useful: the Editor never rewrites prose, and the Author never sees the Editor&#x27;s job.</text>
</svg>